# 技术配置：日常个人信息请修改 _data/profile.yml。
url: https://suyixin.site
baseurl: ''
locale: en-US
timezone: Asia/Shanghai
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge
future: false
include:
- _pages
exclude:
- README.md
- docs
- scripts
- tests
- requirements-dev.txt
- Gemfile
- Gemfile.lock
- vendor
- .bundle
- .github
- LICENSE
- local
collections:
  publications:
    output: true
defaults:
- scope:
    path: ''
    type: pages
  values:
    layout: default
- scope:
    path: ''
    type: publications
  values:
    layout: publication
plugins:
- jekyll-sitemap
- jekyll-redirect-from
